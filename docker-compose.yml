services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gordon-next-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=500
    restart: always
